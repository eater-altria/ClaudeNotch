name: Windows Avalonia build

on:
  push:
    branches: [main]
    paths:
      - 'windows/ClaudeNotch.Avalonia/**'
      - 'windows/ClaudeNotch/Core/**'
      - 'windows/ClaudeNotch.Statusline/**'
      - '.github/workflows/windows-avalonia.yml'
    tags:
      - 'av-v*'
  pull_request:
    paths:
      - 'windows/ClaudeNotch.Avalonia/**'
      - 'windows/ClaudeNotch/Core/**'
      - 'windows/ClaudeNotch.Statusline/**'
      - '.github/workflows/windows-avalonia.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '把构建产物直接上传到这个已存在的 release tag（如 v3.0.1）；留空只出 artifact'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore (win-x64)
        run: dotnet restore ClaudeNotch.Avalonia/ClaudeNotch.Avalonia.csproj -r win-x64

      - name: Publish (self-contained, win-x64, folder)
        run: >
          dotnet publish ClaudeNotch.Avalonia/ClaudeNotch.Avalonia.csproj -c Release -r win-x64
          --no-restore
          --self-contained true
          -p:PublishSingleFile=false
          -o avalonia-publish

      - name: Publish statusLine helper (NativeAOT console, into same folder)
        run: dotnet publish ClaudeNotch.Statusline/ClaudeNotch.Statusline.csproj -c Release -r win-x64 -o avalonia-publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path avalonia-publish/* -DestinationPath ClaudeNotch-avalonia-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeNotch-avalonia-x64
          path: windows/ClaudeNotch-avalonia-x64.zip
          if-no-files-found: error

      - name: Release (on av-v* tag)
        if: startsWith(github.ref, 'refs/tags/av-v')
        uses: softprops/action-gh-release@v2
        with:
          files: windows/ClaudeNotch-avalonia-x64.zip

      # 手动 dispatch 带 release_tag 时：runner 上直接把 zip 传到该 release（免本地下载产物再上传）。
      # 资产命名沿用发版惯例：ClaudeNotch-<版本号去 v>-windows-x64.zip
      - name: Upload to release (workflow_dispatch with release_tag)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.inputs.release_tag }}"
          $ver = $tag -replace '^v', ''
          $asset = "ClaudeNotch-$ver-windows-x64.zip"
          Copy-Item ClaudeNotch-avalonia-x64.zip $asset
          gh release upload $tag $asset --clobber -R ${{ github.repository }}
